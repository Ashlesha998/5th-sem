<!--16.	Give an example using text styling. 
(Use color, letter-spacing, word-spacing, text-align, text decoration, text-transform and text-shadow property).-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        h3
        {
            color: aliceblue;
            text-decoration: underline wavy green;
            text-transform: capitalize;
            text-shadow: 2px 2px red;
        }
        p
        {
            color: crimson;
            letter-spacing: 2px;
            word-spacing: 3px;
            text-align: justify;
        }
    </style>
</head>
<body>
    <h3>In this we can see example of text styling.</h3>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatum eius maxime unde necessitatibus 
        officiis eos minima quae iste quia, id impedit eveniet corporis ducimus earum omnis beatae dolore 
        dolorem. Adipisci!</p>
</body>
</html>
