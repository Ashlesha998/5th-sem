<!--15.	Design a webpage using CSS individual padding property:-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        div
        {
            padding-top: 30px;
            padding-right: 30px;
            padding-bottom: 100px;
            padding-left: 80px;
            border: 1px solid black;
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <h3>Using individual padding properties</h3>
    <div>
        This div element has a top padding of 30px,a right padding of 30px, 
        a bottom padding of 100px, and a left padding of 80px.
    </div>
</body>
</html>
