<!--1.	Give an example of internal CSS. (use at least 5 html elements)-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        h2
        {
            color: blueviolet;
            text-align: center;
        }

        p
        {
            text-shadow: 2px 2px red;
            font-size: large;
            font-style: italic;
        }

        div
        {
            background-color: lightcoral;
            padding: 5px;
            font-style: oblique;
        }
        span
        {
            color: black;
            background-color: yellow;
            margin-right: 10px;
        }
        button
        {
            background-color: green; 
            color: white; 
            padding: 5px 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>
        Internal CSS Demonstration
    </h2>

    <p>
        In this I have used text-shadow and font-size
    </p>

    <div>
        In this I have used background-color and font-style
    </div>

    <span>
        Important text
    </span>

    <button>
        Click Me
    </button>

</body>
</html>
