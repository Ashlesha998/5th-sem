<!--22.	Design a webpage using CSS Max-width property and find the difference between width and max-width.-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        p
        {
            border: 2px solid black;
            width: 300px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .max 
        {
            max-width: 75%;
            background-color: lightblue;
            padding: 10px;
        }

        .width 
        {
            width: 75%;
            background-color: lightcoral;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h3>Max-width</h3>
    <p class="max">This paragraph uses max-width: 75%. It adjusts if needed.</p>
    <hr>
    <h3>Width</h3>
    <p class="width">This paragraph uses max-width: 75%. It adjusts if needed.</p>
</body>
</html>
