<!--14.	Design a webpage using CSS margin property and also explore single value, two values, three values, four values, auto and inherit.-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        .one
        {
            margin: 5px;
        }
        .two
        {
            margin: 10px 15px;
        }
        .three
        {
            margin: 15px 20px 25px;
        }
        .four
        {
            margin: 20px 25px 30px 35px;
        }
        .auto
        {
            margin-top: auto;
            margin-left: 20px;
        }
        .inherit
        {
            margin-left: inherit;
        }
    </style>
</head>
<body>
    <p class="one">In this single value of margin property was used </p>
    <p class="two">In this two value of margin property was used </p>
    <p class="three">In this three value of margin property was used </p>
    <p class="four">In this four value of margin property was used </p>
    <div class="auto">
       <p>In this auto value of margin property was used </p>
       <div class="inherit">
            <p>In this inherit value of margin property was used </p> 
       </div>
    </div>
    
</body>
</html>
