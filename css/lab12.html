<!--12.	Design a webpage using individual border style like below:-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        .border
        {
            border-top:3px dotted blue;
            border-right:3px solid red;
            border-bottom:3px outset green;
            border-left:3px dashed red;
        }
    </style>
</head>
<body>
    <h1>Individual Border Style</h1>
    <p class="border">4 different border styles</p>
</body>
</html>
