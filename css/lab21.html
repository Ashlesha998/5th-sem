<!--21.	Display a horizontal list of link using CSS display property.-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        hr
        {
            background-color: palevioletred;
            width: 100%;
            height: 2px;
        }
        ul
        {
            list-style: none;
        }
        li
        {
            display: inline;
        }
    </style>
</head>
<body>
    <div>
        <hr>

        <h3>Display a list of links as a a horizontal menu</h3>
        <ul>
            <li><a href="/html/">HTML</a></li>
            <li><a href="/css/">CSS</a></li>
            <li><a href="JS/">JavaScript</a></li>
        </ul>
    </div>
</body>
</html>
