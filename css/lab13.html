<!--13.	Design a webpage using border-radius property like below:-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        .normal
        {
            border-radius: none;
            border: 3px solid blue;
            padding: 3px;
        }
        .round
        {
            border: 3px solid red;
            border-radius: 4px;
            padding: 3px;
        }
        .rounder
        {
            border: 3px solid green;
            border-radius: 7px;
            padding: 3px;
        }
        .roundest
        {
            border: 3px solid silver;
            border-radius: 10px;
            padding: 3px;
        }
    </style>
</head>
<body>
    <p class="normal">Normal border</p>
    <p class="round">Round border</p>
    <p class="rounder">Rounder border</p>
    <p class="roundest">Roundest border</p>
</body>
</html>
