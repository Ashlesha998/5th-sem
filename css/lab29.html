<!--29.	Give an example using media queries.-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        @media (max-width: 600px)
        {
            body
            {
                background-color: pink;
            }
        }

        @media (min-width: 600px)
        {
            body
            {
                background-color: lavender;
            }
        }
    </style>
</head>
<body>
    <h3>Media Queries</h3>
    <p>CSS media queries allow you to apply styles based on the characteristics of a device or the environment displaying the web page.
        CSS media queries are essential for creating responsive web pages.
        The CSS @media rule is used to add media queries to your style sheet.
    </p>
</body>
</html>
