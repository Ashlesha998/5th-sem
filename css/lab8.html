<!--8.	Design a webpage using pseudo element selector.-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        p::selection
        {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <p>CSS pseudo-element is a keyword that can be added to a selector, to style a specific part of an element.</p>
</body>
</html>
