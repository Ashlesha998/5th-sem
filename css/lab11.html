<!--11.	Design a webpage using border-style, border-color and border-width like below:-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        .dotted
        {
            border-style: dotted;
            border-color: green;
            border-width: 3px;
        }
        .dashed
        {
            border-style: dashed;
            border-color: blue;
            border-width: 3px;
        }
        .solid
        {
            border-style: solid;
            border-color: pink;
            border-width: 3px;
        }
        .double
        {
            border-style: double;
            border-color: green;
            border-width: 3px;
        }
        .groove
        {
            border-style: groove;
            border-color: red;
            border-width: 2px;
        }
        .ridged
        {
            border-style: ridge;
            border-color:lavender;
            border-width: 2px;
        }
        .inset
        {
            border-style: inset;
            border-color: black;
            border-width: 2px;
        }
        .outset
        {
            border-style: outset;
            border-color: green;
            border-width: 2px;
        }
        .no
        {
            border-style: none;
        }
        .hidden
        {
            border-style: hidden;
        }
        .mixed
        {
            border-style: dotted dashed solid double;
            border-color: red;
        }

    </style>
</head>
<body>
    <h3>The border-style property</h3>
    <p>This property specifies what kind of border to display</p>
    <p class="dotted">A dotted border.</p>
    <p class="dashed">A dashed border.</p>
    <p class="solid">A solid border.</p>
    <p class="double">A double border.</p>
    <p class="groove">A groove border.</p>
    <p class="ridged">A ridge border.</p>
    <p class="inset">An inset border.</p>
    <p class="outset">An outset border.</p>
    <p class="no">No border.</p>
    <p class="hidden">A hidden border.</p>
    <p class="mixed">A mixed border.</p>
</body>
</html>
