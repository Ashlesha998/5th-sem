<!--24.	Make small boxes using HTML elements and CSS. And use CSS float property with the value left or right.-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        .square
        {
            background-color: lightcyan;
            float: left;
            border: 1px solid black;
            margin: 5px;
            padding: 20px;
            font-weight: bold;
            font-size: large;
        }
    </style>
</head>
<body>
    <h3>CSS float property</h3>
    <p class="square">Box 1</p>
    <p class="square">Box 2</p>
    <p class="square">Box 3</p>
    <p class="square">Box 4</p>
</body>
</html>
