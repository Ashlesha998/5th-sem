<!--4.	Give an example of simple selector and grouping selector. -->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <link rel="stylesheet" href="lab4.css">
</head>
<body>
    <h1>Simple selector</h1>
    <div class="simple">
        <p>This contains simple selector</p>
        <label for="name" class="fname">First name:</label>
        <input type="text"><br>
        <label for="name" id="lname">Last name:</label>
        <input type="text">
    </div>

    <h2>Grouping Selector</h2>
    <div class="group">
        <p>This contains group selector</p>
        <label for="name" class="fname">First name:</label>
        <input type="text"><br>
        <label for="name" id="lname">Last name:</label>
        <input type="text">
    </div>
</body>
</html>
