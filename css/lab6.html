<!--6.	Design a webpage using attribute selector. Give proper example using:
a.	CSS [attribute] Selector
b.	CSS [attribute="value"] Selector
c.	CSS [attribute~="value"] Selector
d.	CSS [attribute|="value"] Selector
e.	CSS [attribute^="value"] Selector
f.	CSS [attribute$="value"] Selector3
g.	CSS [attribute*="value"] Selector
-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>

        a[target]
        {
            text-decoration: none;
            font-size: large;
        }

        a[target="_parent"]
        {
            color: green;
        }

        [title~="Waterfall"]
        {
            border-radius: 25px;
        }
        [class|=head]
        {
            background-color: red;
        }

        [class^="title"]
        {
            font-style: italic;
        }

        [class$="title"]
        {
            color: darkblue;
            text-shadow: 2px 2px RED;
        }

        [class*="e"]
        {
            color:gray
        }
    </style>
</head>
<body>
