<!--17.	Design a webpage using <form> tag like below:-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        label{
            font-weight: bold;
        }

        legend{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <H1 style="text-align: center;">NCCS College</H1>
    <h4 style="text-align: center;">Student Detail Form</h4>
    <hr style="border-color: blue;">

    <form>
        <fieldset>
            <legend>Personal information</legend>
            <div>
                <label for="name">Name:</label>
                <input type="text"><br><br>

                <label for="add">Address:</label>
                <input type="text"><br><br>
                
                <label for="Sex">Sex:</label>
                <input type="radio" name="sex">Male
                <input type="radio" name="sex">Female<br><br>
                
                <label for="Color">Select your favourite Color:</label>
                <input type="color"><br><br>

                <label for="dob">Date of birth:</label>
                <input type="date"><br><br>

                <label for="photo>">Upload Citizenship photo: </label>
                <input type="file"><br><br>

                <label for="number">Mobile number:</label>
                <input type="number"><br><br>

                <label for="time">Appointment time:</label>
                <input type="time">
            </div>
        </fieldset>

        <fieldset>
            <legend style="text-align: right;">Hobby and Education</legend>

            <label for="hobby">Hobbies:</label>
            <input type="checkbox">Movies
            <input type="checkbox">Playing football
            <input type="checkbox">Reading Novel
            <input type="checkbox">Others<br><br>

            <label for="education">Education:</label>
            <select name="Education">
                <option value="">Phd</option>
                <option value="">Master</option>
                <option value="">Bachelor</option>
            </select>
        </fieldset>
        <hr style="border-color: black; border-width: 2px;">
        <label for="words"> Few Words:</label><br>
        <textarea rows="5" cols="50"></textarea>
        <br><br>
        <input type="button" value="Send">
        <input type="button" value="Clear">
    </form>
    
</body>
</html>
