<!--20.	Design a webpage using HTML Sectioning elements. Try to make like this:-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        header
        {
            background-color: black;
            color: white;
            text-align: center;
            padding-top: 10px;
            padding-bottom: 25px;
        }

        #but
        {
            position: fixed;
            top: 55px;
        }

        .nav
        {
            background-color: pink;
            padding: 10px;
        }
        
        section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px;
        }
        img
        {
            width: 65%;
            height: auto;
        }
        aside
        {
            width: 30%;
            padding: 15px;
            font-style: italic;
            background-color: lightgray;
        }

        
        footer 
        {
            background-color: red;
            color: white;
            text-align: center;
            padding: 2px;
        }
    </style>
</head>
<body>
    <header>
        <p>This is my Website</p>
        <input type="button" value="login" id="but">
    </header>

    <nav class="nav">
        <a href="/Home/" style="color: white;">Home</a>
        <a href="/Contact/" style="color: black;">Contact</a>
        <a href="/Product/">Product</a>
    </nav>

    <section>
        <img src="daraz.png" alt="pictures of phone" 
        height="300px" width="600px">
        <aside>
            <p>Epcot is a theme park at Walt Disney World Resort featuring exciting attractions, international pavilions, award-winning fireworks and seasonal special events.</p></aside>
    </section>

    <footer>
        <p>2023</p>
    </footer>
    
</body>
</html>
