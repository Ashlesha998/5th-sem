<!--15.	Merge table using rowspan and colspan attribute like below:-->
<!DOCTYPE html>
<html>
<head>
   <title>Ashlesha</title>
</head>
<body>
    <table border="3" style="border: solid; border-color:green">
        <tr>
        <th rowspan="2">Row 1 and 2, Column 1</th>
        <th>Row 1, Column 1</th>
        </tr>
        <tr>
            <td>Row 2, Column 2</td>
        </tr>
        <tr>
            <td colspan="2">Row 1, Column 1 and 2</td>
        </tr>
    </table>
</body>
</html>
