<!--2.	Design a webpage showing the use of heading tag(<h1> to <h6>) with background color “blue” and text color “red”.-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
    <style>
        .heading
        {
            background-color: blue;
            color: red;
        }
    </style>
</head>
<body>
    <div class="heading">
        <h1>This is the largest heading.</h1>
        <h2>This is the second largest heading.</h2>
        <h3>This is the third largest heading.</h3>
        <h4>This is the fourth largest heading.</h4>
        <h5>This is the fifth largest heading.</h5>
        <h6>This is the smallest heading.</h6>
    </div>
</body>
</html>
