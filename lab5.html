<!--5.	Design a webpage showing the use of Text formatting tags.-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
</head>
<body>
    <p><b>This text is in bold.</b> </p>
    <p><u>This text is underlined.</u></p>
    <p><i>This text is italicized.</i></p>
    <p><strong>This text is in strong.</strong></p>
    <p><em>This is an emphasized text.</em> </p>
    <p><mark>This text is marked.</mark></p>
    <p>This has <small>smaller </small> text.</p>
    <p><del>This is the deleted text.</del></p>
    <p><ins>This text is inserted.</ins></p>
    <p>This has <sub>subscripted</sub> text.</p>
    <p>This has <sup>superscripted</sup> text.</p>
</body>
</html>
