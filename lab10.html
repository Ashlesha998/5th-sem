<!--10.	Design a webpage using unordered list, ordered list and description list like given below:-->
<!DOCTYPE html>
<html>
<head>
    <title>Ashlesha</title>
</head>
<body>
    <h3>An unordered HTML list</h3>
    <ul>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ul><br>

    <h3>An ordered HTML list</h3>
    <ol>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ol><br>

    <h3>A Description List</h3>
    <dl>
        <dt>Coffee</dt>
        <dd>- black hot drink</dd>

        <dt>Milk</dt>
        <dd>- white cold drink</dd>
    </dl>
</body>
</html>
